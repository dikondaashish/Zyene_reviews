name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history so the migration guard can diff against the base branch.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Color Guard
        run: pnpm run check:colors

      - name: File Size Guard
        run: pnpm run check:sizes

      # Does not run migrations and never touches a database. Blocks edits to
      # already-applied migrations, and requires new ones to state when they
      # get applied relative to the code that needs them.
      - name: Migration Guard
        run: pnpm run check:migrations

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

